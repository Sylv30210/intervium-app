[build]
  publish = "Frontend"

[[redirects]]
  from = "/api/*"
  to = "https://intervium-app.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://intervium-app.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
